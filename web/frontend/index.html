<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA installability. use-credentials sends the session cookie with the
         manifest fetch so it works behind an auth proxy (e.g. Pangolin SSO). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#090b0d" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="OwlShack" />
    <meta name="apple-mobile-web-app-title" content="OwlShack" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>OwlShack | Operator Console</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- OSM Standard in dark mode (.tiles-darken): fitted to its palette so water sits below land, not inverted above it. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="osm-dark" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.6970 -1.0634 -0.4150 0 0.8686  0.5253 -0.7740 -0.5345 0 0.8688  0.4773 -1.0173 -0.2240 0 0.8694  0 0 0 1 0"
        />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
